<svg
  viewBox="0 0 34 46"
  width="100%"
  height="100%"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Realistic 3D Soft Drop Shadow Filter -->
    <filter id="token-shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Chrome Outer Rim Gradient -->
    <linearGradient id="chrome-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f2f2f2" />
      <stop offset="60%" stop-color="#cfcfcf" />
      <stop offset="85%" stop-color="#9a9a9a" />
      <stop offset="100%" stop-color="#555555" />
    </linearGradient>

    <!-- Chrome Inner Bevel Gradient -->
    <linearGradient id="chrome-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#e8e8e8" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#adadad" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6e6e6e" stop-opacity="0.95" />
    </linearGradient>

    <!-- Pin Dome Ambient Occlusion / Radial Depth -->
    <radialGradient id="dome-highlight" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65" />
    </radialGradient>
  </defs>

  <!-- Pin Outer Body with 3D Chrome Bezel -->
  <g filter="url(#token-shadow)">
    <!-- Base chrome outline / outer rim -->
    <path
      d="M 17,43.5 C 12,34 3,23.5 3,15 A 14,14 0 1,1 31,15 C 31,23.5 22,34 17,43.5 Z"
      fill="url(#chrome-rim)"
      stroke="#1a1a1a"
      stroke-width="1.3"
      stroke-linejoin="round"
    />

    <!-- Inner Chrome Bevel -->
    <path
      d="M 17,40.5 C 12.8,32 5,22.5 5,15 A 12,12 0 1,1 29,15 C 29,22.5 21.2,32 17,40.5 Z"
      fill="url(#chrome-bevel)"
    />

    <!-- Color Fill Base -->
    <circle
      cx="17"
      cy="15"
      r="9.5"
      fill="var(--fill-colour, #1295e7)"
      stroke="#1a1a1a"
      stroke-width="0.9"
    />

    <!-- 3D Spherical Specular Lighting Layer -->
    <circle
      cx="17"
      cy="15"
      r="9.5"
      fill="url(#dome-highlight)"
    />

    <!-- Top-Left Sharp Specular Glint -->
    <ellipse
      cx="13.5"
      cy="10.8"
      rx="3.5"
      ry="2.2"
      transform="rotate(-25 13.5 10.8)"
      fill="#ffffff"
      opacity="0.9"
    />
  </g>
</svg>

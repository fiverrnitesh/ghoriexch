<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft 3D drop shadow -->
    <filter id="diceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Realistic white acrylic gradients with soft lighting -->
    <linearGradient id="die1Front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#d1d9e6" />
    </linearGradient>

    <linearGradient id="die1Top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="die2Front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#d5dde8" />
    </linearGradient>

    <linearGradient id="die2Side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <radialGradient id="pipGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
  </defs>

  <!-- Group with shadow -->
  <g filter="url(#diceShadow)">
    <!-- 1. Horizontal Long Rectangle Die (Left, lying down) -->
    <!-- Front Face -->
    <rect x="12" y="94" width="128" height="58" rx="12" ry="12" fill="url(#die1Front)" stroke="rgba(255,255,255,0.95)" stroke-width="1.5" />
    <!-- Top Highlight -->
    <path d="M 24 95 L 128 95 Q 138 95 132 99 L 30 99 Q 16 99 24 95 Z" fill="#ffffff" opacity="0.8" />
    <!-- Pips on horizontal die (Face 2 & 1) -->
    <circle cx="48" cy="113" r="6.5" fill="url(#pipGlow)" />
    <circle cx="48" cy="133" r="6.5" fill="url(#pipGlow)" />
    <circle cx="98" cy="123" r="6.5" fill="url(#pipGlow)" />

    <!-- 2. Vertical Tall Rectangle Die (Right, standing upright) -->
    <!-- Right side shadow face for 3D depth -->
    <path d="M 166 28 L 180 40 L 180 160 L 166 148 Z" fill="url(#die2Side)" opacity="0.95" />
    
    <!-- Top face for 3D depth -->
    <path d="M 118 24 L 134 12 L 176 24 L 162 36 Z" fill="url(#die2Top)" />

    <!-- Front vertical face -->
    <rect x="110" y="26" width="56" height="136" rx="12" ry="12" fill="url(#die2Front)" stroke="rgba(255,255,255,0.95)" stroke-width="1.5" />
    
    <!-- Vertical Top Highlight -->
    <path d="M 122 28 L 154 28 Q 164 28 160 32 L 126 32 Q 116 32 122 28 Z" fill="#ffffff" opacity="0.9" />

    <!-- Pips on vertical die (Face 4 / 3 column: top, mid-top, mid-bottom, bottom) -->
    <circle cx="138" cy="52" r="6.5" fill="url(#pipGlow)" />
    <circle cx="138" cy="83" r="6.5" fill="url(#pipGlow)" />
    <circle cx="138" cy="114" r="6.5" fill="url(#pipGlow)" />
    <circle cx="138" cy="142" r="6" fill="url(#pipGlow)" />
  </g>
</svg>
